version: '3.8'

services:
  # ===========================================
  # Next.js 应用 - 开发环境
  # ===========================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./data:/app/data
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/db/dev.db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    command: pnpm dev

  # ===========================================
  # Redis 缓存服务
  # ===========================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
